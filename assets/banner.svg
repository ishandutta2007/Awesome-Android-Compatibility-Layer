<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .bg-grid { stroke: #30363d; stroke-width: 1; stroke-opacity: 0.25; }
      .pulse-circle { animation: pulse 4s infinite ease-in-out; }
      .dash-line { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
      .float-node { animation: float 6s infinite ease-in-out; }
      .glow-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.7; }
        100% { transform: scale(1); opacity: 0.3; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Tech Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>

    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1050" y1="0" x2="1050" y2="300"/>
  </g>

  <!-- Dynamic Background Animated Graphic Elements (Behind Text) -->
  <g opacity="0.4">
    <!-- Connecting animated circuit lines -->
    <path d="M 100 220 L 300 220 L 400 260 L 800 260 L 900 220 L 1100 220" stroke="url(#line-grad)" stroke-width="3" fill="none" class="dash-line"/>
    <path d="M 50 50 L 250 50 L 350 20 L 850 20 L 950 50 L 1150 50" stroke="url(#line-grad)" stroke-width="2" fill="none" class="dash-line"/>

    <!-- Glowing Animated Pulsing Background Orbs -->
    <circle cx="150" cy="150" r="80" fill="#3ddc84" filter="url(#glow)" class="pulse-circle" opacity="0.15"/>
    <circle cx="1050" cy="150" r="90" fill="#00b0ff" filter="url(#glow)" class="pulse-circle" opacity="0.15"/>
    <circle cx="600" cy="150" r="120" fill="#a855f7" filter="url(#glow)" class="pulse-circle" opacity="0.1"/>

    <!-- Decorative Floating Tech Nodes -->
    <g class="float-node">
      <rect x="80" y="80" width="40" height="40" rx="8" fill="#1f2937" stroke="#3ddc84" stroke-width="1.5" opacity="0.8"/>
      <path d="M 92 100 L 108 100 M 100 92 L 100 108" stroke="#3ddc84" stroke-width="2"/>
    </g>
    <g class="float-node" style="animation-delay: -3s;">
      <rect x="1080" y="180" width="40" height="40" rx="8" fill="#1f2937" stroke="#00b0ff" stroke-width="1.5" opacity="0.8"/>
      <circle cx="1100" cy="200" r="6" fill="#00b0ff"/>
    </g>
  </g>

  <!-- Foreground Foreground Content (Strictly Layered On Top) -->
  <g text-anchor="middle">
    <!-- Main Title Icon / Logo Graphic -->
    <g transform="translate(600, 75)">
      <!-- Android Head Outline -->
      <path d="M-22,-2 A22,22 0 0,1 22,-2 Z" fill="#3ddc84" />
      <circle cx="-8" cy="-10" r="2.5" fill="#0d1117" />
      <circle cx="8" cy="-10" r="2.5" fill="#0d1117" />
      <line x1="-12" y1="-20" x2="-17" y2="-27" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="-20" x2="17" y2="-27" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#text-grad)" class="glow-title" font-size="42" letter-spacing="1">Awesome Android Compatibility Layer</text>

    <!-- Subtitle -->
    <text x="600" y="190" fill="#e6edf3" class="sub-title" font-size="18" letter-spacing="0.5">Run Android Apps &amp; Games on Linux, Cloud &amp; Windows natively without emulation</text>

    <!-- Tech Badges Pill Bar -->
    <g transform="translate(600, 235)">
      <!-- Pill 1: Waydroid -->
      <g transform="translate(-240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="0" y="4" fill="#3ddc84" font-family="sans-serif" font-size="12" font-weight="600">🐧 Waydroid</text>
      </g>
      <!-- Pill 2: redroid -->
      <g transform="translate(-80, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="0" y="4" fill="#00b0ff" font-family="sans-serif" font-size="12" font-weight="600">☁️ redroid</text>
      </g>
      <!-- Pill 3: ATL -->
      <g transform="translate(80, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="0" y="4" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="600">⚡ ATL</text>
      </g>
      <!-- Pill 4: Emulators -->
      <g transform="translate(240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
        <text x="0" y="4" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600">🎮 Emulators</text>
      </g>
    </g>
  </g>
</svg>
